<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="System zarządzania magazynem"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    
    <!-- Dodanie czcionki Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>Panel sprzedaży - E-Dekor</title>
  </head>
  <body>
    <noscript>Musisz włączyć JavaScript, aby uruchomić tę aplikację.</noscript>
    <div id="root"></div>
    <script>
      // Agresywny skrypt do wyrejestrowania wszystkich service workerów
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          if (registrations.length > 0) {
            console.log('Znaleziono aktywne service workery. Próba wyrejestrowania...');
            for (let registration of registrations) {
              registration.unregister();
              console.log('Service worker wyrejestrowany:', registration);
            }
            // Odśwież stronę, aby upewnić się, że zmiany weszły w życie
            window.location.reload();
          }
        }).catch(function(err) {
          console.error('Błąd podczas wyrejestrowywania service workera:', err);
        });
      }
    </script>
  </body>
</html>
